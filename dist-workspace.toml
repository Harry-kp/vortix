[workspace]
members = ["cargo:crates/vortix"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew", "npm"]
tap = "Harry-kp/homebrew-tap"
npm-scope = "@harry-kp"
publish-jobs = ["homebrew", "npm", "./linux-packages", "./release-notes"]
# Both custom jobs edit the release: one attaches .deb/.rpm, one adds the notes
github-custom-job-permissions = { "linux-packages" = { contents = "write" }, "release-notes" = { contents = "write" } }
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
# Checksums to generate for each App
checksum = "sha256"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
