[workspace]
members = ["cargo:crates/vortix"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
npm-scope = "@harry-kp"
# npm publishes through ./npm-publish (trusted publishing, no token), not dist's own job
publish-jobs = ["./npm-publish", "./linux-packages"]
# The Linux packages job attaches its .deb and .rpm to the release
github-custom-job-permissions = { "linux-packages" = { contents = "write" }, "npm-publish" = { "id-token" = "write" } }
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
# Checksums to generate for each App
checksum = "sha256"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
