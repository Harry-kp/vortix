# .deb and .rpm for vortix; built by .github/workflows/linux-packages.yml.
name: vortix
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: net
maintainer: Harry KP <harrykp@users.noreply.github.com>
description: Terminal UI for WireGuard and OpenVPN with multi-tunnel control, real-time telemetry, and leak guarding
homepage: https://github.com/Harry-kp/vortix
license: MIT
recommends:
  - wireguard-tools
  - openvpn
contents:
  - src: target/linux-package/vortix
    dst: /usr/bin/vortix
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/vortix/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/vortix/LICENSE
    packager: rpm
