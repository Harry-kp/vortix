name: Boundary

on:
  # Runs on docs-only changes too: the docs checks keep docs and code in step.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  boundary:
    name: Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Subprocess boundary
        run: cargo xtask check-subprocess
      - name: Platform boundary
        run: cargo xtask check-platform-leak
      - name: Protocol boundary
        run: cargo xtask check-protocol-leak
      - name: Shell-regression guard
        run: cargo xtask check-no-shell-regressions
      - name: Doc links and anchors resolve
        run: cargo xtask check-docs
      - name: Docs name every command, flag and config key
        run: cargo test -p vortix --test suite docs_match_code
