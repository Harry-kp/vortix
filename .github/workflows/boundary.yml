name: Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  boundary:
    name: Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Subprocess boundary (plan 002)
        run: cargo xtask check-subprocess
      - name: Platform boundary (plan 003)
        run: cargo xtask check-platform-leak
      - name: Protocol boundary (plan 004)
        run: cargo xtask check-protocol-leak
