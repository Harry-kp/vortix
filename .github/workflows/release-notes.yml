name: Release Notes

# cargo-dist writes an install/download body only, so this prepends the
# matching CHANGELOG.md section as "## Release Notes". The release workflow
# calls it after publishing (a release made with GITHUB_TOKEN fires no
# `release` event); run it by hand to fix an existing release.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.5.1"
        required: true

permissions:
  contents: write

jobs:
  inject-notes:
    name: Inject changelog into release body
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepend changelog section to release body
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$PLAN" ]; then
            TAG=$(echo "$PLAN" | jq -r '.announcement_tag')
          else
            TAG="$DISPATCH_TAG"
          fi
          EXISTING_BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)

          # Idempotency: if notes are already present (manual fix, or a
          # re-run), do nothing.
          case "$EXISTING_BODY" in
            *"## Release Notes"*)
              echo "Release body already has notes; nothing to do."
              exit 0
              ;;
          esac

          # Tag "v0.4.3" -> changelog version "0.4.3".
          VERSION="${TAG#v}"

          CHANGELOG="crates/vortix/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            echo "No $CHANGELOG found; skipping." >&2
            exit 0
          fi

          # Extract the section between "## [<version>]" and the next
          # "## [" heading, dropping the version heading line itself
          # (the release page already shows the version).
          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' "$CHANGELOG" | sed '/^[[:space:]]*$/{ /./d }' )"

          # Trim leading/trailing blank lines.
          SECTION="$(printf '%s\n' "$SECTION" | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba}')"

          if [ -z "$SECTION" ]; then
            echo "No changelog section for $VERSION; leaving body unchanged." >&2
            exit 0
          fi

          BODYFILE="$(mktemp)"
          {
            echo "## Release Notes"
            echo
            printf '%s\n' "$SECTION"
            echo
            echo "---"
            echo
            printf '%s\n' "$EXISTING_BODY"
          } > "$BODYFILE"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODYFILE"
          echo "Injected notes for $TAG."
