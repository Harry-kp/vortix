name: npm publish

# Publishes the npm package (scripts/npm-package.sh: the release's binaries, no
# install script) with npm trusted publishing: npm checks
# this workflow's identity token, so there is no NPM_TOKEN to expire. The
# release workflow calls it after publishing. npm matches the *calling* workflow,
# so the trusted publisher on npmjs.com names release.yml.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No registry-url: setup-node would write a placeholder token that npm
      # falls back to when the trusted-publishing exchange fails, hiding why.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install -g npm@11
      - name: Build the package from the release's binaries
        env:
          PLAN: ${{ inputs.plan }}
        run: scripts/npm-package.sh "$(echo "$PLAN" | jq -r '.announcement_tag')" npm-out
      - name: Publish
        env:
          # Shows the trusted-publishing token exchange, which npm logs only at verbose.
          NPM_CONFIG_LOGLEVEL: verbose
        # The ./ makes npm read a local tarball; a bare dir/file is taken as a GitHub repo.
        run: npm publish --access public ./npm-out/*.tgz
