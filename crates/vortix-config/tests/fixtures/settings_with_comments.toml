# vortix settings — hand-curated by the maintainer.
# Plan 017 invariant: every byte outside the [[hooks]] region must
# survive a TUI write unchanged.

log_level = "info"   # default; overridden via VORTIX_LOG_LEVEL
max_log_entries = 1000

# Hooks below — managed by the TUI.

[[hooks]]
event = "post_connect"
command = ["echo", "hello"]

# This comment sits between hook entries and should survive.

[[hooks]]
event = "post_disconnect"
command = ["echo", "bye"]
timeout_secs = 10

# Trailing comment after the hooks array.
